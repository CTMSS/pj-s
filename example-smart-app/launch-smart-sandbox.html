<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SMART Launch (SMART Health IT Sandbox)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  </head>
  <body>
    <script>
      /* NOTE:
       * ตามคู่มือ Cerner: SMART App Launcher (launch.smarthealthit.org) ปัจจุบันไม่ตรวจสอบค่า client_id
       * จึงใส่ค่าใดก็ได้สำหรับการทดสอบกับ Launcher นี้ หากนโยบายเปลี่ยน ให้ใช้ clientId ที่ลงทะเบียนกับ
       * SMART Sandbox แทน (หรือปรับในไฟล์นี้) */
      FHIR.oauth2.authorize({
        clientId: "smart-sandbox-test-client",
        scope: "patient/Patient.read patient/Observation.read launch online_access openid profile"
      });
    </script>
  </body>
</html>
