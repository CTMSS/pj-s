<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Launch SMART App</title>
</head>
<body>
  <!-- โหลดไลบรารีหลักก่อน -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.4.6/build/fhir-client.min.js"></script>

  <!-- จากนั้นค่อยโหลด Cerner additions -->
  <script src="https://cdn.jsdelivr.net/gh/cerner/fhir-client-cerner-additions@1.0.0/dist/fhir-client-cerner-additions-1.0.0.js"></script>

  <!-- สคริปต์ launch -->
  <script>
    FHIR.oauth2.authorize({
      clientId: "1345af79-94d1-44bc-9a98-adf6431f8376",
      scope: "launch openid profile online_access patient/Patient.read patient/Observation.read",
      redirectUri: "./"
    });
  </script>
</body>
</html>
