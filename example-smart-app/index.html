<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>pj-s SMART App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
      code, pre { background: #f6f8fa; padding: 2px 6px; border-radius: 6px; }
      .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin: 12px 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  </head>
  <body>
    <h1>pj-s SMART App</h1>
    <div id="out" class="card">Loading…</div>
    <script>
      const out = document.getElementById("out");
      const show = (html) => out.innerHTML = html;
      FHIR.oauth2.ready().then(async client => {
        try {
          const pid = client.getPatientId();
          const patient = await client.request(`Patient/${pid}`);
          const obs = await client.request(`Observation?patient=${pid}&_count=5`);
          const name = patient.name?.[0] || {};
          const displayName = [name.given?.join(" "), name.family].filter(Boolean).join(" ");
          const items = (obs.entry||[]).map(e => {
            const o = e.resource;
            const code = o.code?.text || o.code?.coding?.[0]?.display || o.code?.coding?.[0]?.code || "Observation";
            const val = o.valueQuantity ? `${o.valueQuantity.value} ${o.valueQuantity.unit||""}`.trim()
                        : o.valueString || o.valueCodeableConcept?.text || "—";
            return `<li>${code}: <strong>${val}</strong></li>`;
          }).join("");
          show(`
            <div class="card">
              <h2>Patient</h2>
              <p><strong>${displayName||"Unknown"}</strong> (ID: ${pid})</p>
            </div>
            <div class="card">
              <h2>Recent Observations</h2>
              <ul>${items||"<li>None</li>"}</ul>
            </div>
          `);
        } catch (e) {
          show("<pre>"+(e.stack||e.message||e)+"</pre>");
        }
      }).catch(e => show("<pre>"+(e.stack||e.message||e)+"</pre>"));
    </script>
  </body>
</html>
